services:
  backend1:
    image: nginx:alpine
    volumes:
      - ./backend1/index.html:/usr/share/nginx/html/index.html:ro

  backend2:
    image: nginx:alpine
    volumes:
      - ./backend2/index.html:/usr/share/nginx/html/index.html:ro

  backend3:
    image: nginx:alpine
    volumes:
      - ./backend3/index.html:/usr/share/nginx/html/index.html:ro

  loadbalancer:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend1
      - backend2
      - backend3
